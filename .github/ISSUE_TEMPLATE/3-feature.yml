name: 기능 제안
description: 새 규칙 · 스킬 · 플러그인, 또는 지금 규칙을 바꾸자는 제안
title: "<플러그인>: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: 플러그인
      options:
        - frontend
        - statusline
        - 새 플러그인
        - 여러 개 · 기타
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 어떤 문제를 풀려는가
      description: 실제로 부딪힌 상황과 지금 방식의 한계
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 생각해 본 다른 방법
